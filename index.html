<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Project Dazzler</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    .frame-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100svh; /* better on mobile */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @supports (height: 100dvh) {
      .frame-wrap {
        height: 100dvh;
      }
    }
  </style>
</head>
<body>
  <div class="frame-wrap">
    <iframe
      src="https://dzl-project-page-emht.hub.arcgis.com"
      allowfullscreen
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>
</body>
</html>
